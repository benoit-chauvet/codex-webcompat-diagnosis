<!doctype html>
<meta charset="utf-8">
<title>GSMArena H.264 Profile 244 Playback Test</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: #1f2933; }
  main { max-width: 980px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .case { border: 1px solid #c9d2dc; padding: 12px; border-radius: 6px; }
  video { width: 100%; aspect-ratio: 16 / 9; background: #111; display: block; }
  pre { white-space: pre-wrap; background: #f4f7fa; padding: 12px; border-radius: 6px; }
</style>
<main>
  <h1>GSMArena H.264 Profile 244 Playback Test</h1>
  <p>Control uses a known playable H.264 Main-profile MP4. The GSMArena samples use H.264 profile_idc 244 from the live article.</p>
  <div class="grid">
    <section class="case">
      <h2>Control</h2>
      <video id="control" muted controls src="assets/control_main_profile.mp4"></video>
    </section>
    <section class="case">
      <h2>GSMArena 001</h2>
      <video id="gsmarena001" muted controls src="assets/gsmarena_001_profile244.mp4"></video>
    </section>
    <section class="case">
      <h2>GSMArena 002</h2>
      <video id="gsmarena002" muted controls src="assets/gsmarena_002_profile244.mp4"></video>
    </section>
  </div>
  <pre id="state"></pre>
</main>
<script>
  const ids = ["control", "gsmarena001", "gsmarena002"];
  function collect() {
    const state = {
      canPlayProfile244: document.createElement("video").canPlayType('video/mp4; codecs="avc1.f4001f"'),
      videos: ids.map(id => {
        const video = document.getElementById(id);
        return {
          id,
          readyState: video.readyState,
          networkState: video.networkState,
          currentTime: video.currentTime,
          duration: Number.isFinite(video.duration) ? video.duration : null,
          videoWidth: video.videoWidth,
          videoHeight: video.videoHeight,
          error: video.error ? { code: video.error.code, message: video.error.message } : null,
        };
      }),
    };
    document.getElementById("state").textContent = JSON.stringify(state, null, 2);
    return state;
  }
  for (const id of ids) {
    const video = document.getElementById(id);
    video.addEventListener("loadedmetadata", collect);
    video.addEventListener("error", collect);
    video.load();
  }
  setInterval(collect, 500);
</script>

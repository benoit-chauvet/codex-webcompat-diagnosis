<!doctype html>
<meta charset="utf-8">
<div id="hero" style="width:640px;height:300px;background:linear-gradient(90deg,#eee,#ddd)"></div>
<pre id="state"></pre>
<script>
  try {
    window.wafer.ready(() => {
      document.getElementById("hero").textContent = "loaded";
    });
  } catch (error) {
    document.getElementById("state").textContent = JSON.stringify({
      loaded: false,
      error: error.message,
    }, null, 2);
  }
</script>
